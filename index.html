<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Frete</title>
    <link rel="stylesheet" href="calcularF.css">
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <div>
                <h1><strong>Calculadora de Frete </strong></h1>
                <p>Faça uma cotação de transporte rodoviário</p>
            </div>
        </header>

        <form class="formulario" onsubmit="event.preventDefault(); calcularFrete();">
            <section class="card">
                <h2>Dados do cliente</h2>

                <div class="grid">
                    <div class="campo campoGrande">
                        <label for="cliente">Nome ou razão social</label>
                        <input type="text" id="cliente" placeholder="Digite o nome do cliente">
                    </div>

                    <div class="campo">
                        <label for="origem">Cidade de origem</label>
                        <input type="text" id="origem" placeholder="Ex.: Salvador">
                    </div>

                    <div class="campo">
                        <label for="destino">Cidade de destino</label>
                        <input type="text" id="destino" placeholder="Ex.: Feira de Santana">
                    </div>
                </div>
            </section>

            <section class="card">
                <h2>Dados da carga</h2>

                <div class="grid">
                    <div class="campo">
                        <label for="distancia">Distância estimada</label>
                        <div class="entradaUnidade">
                            <input type="number" id="distancia" min="1" step="0.01" placeholder="0">
                            <span>km</span>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="valorNota">Valor da nota fiscal</label>
                        <div class="entrada-unidade">
                            <span>R$</span>
                            <input type="number" id="valorNota" min="0" step="0.01" placeholder="0,00">
                        </div>
                    </div>

                    <div class="campo campoGrande">
                        <label for="mercadoria">Descrição da mercadoria</label>
                        <textarea id="mercadoria" rows="3" placeholder="Descreva a mercadoria"></textarea>
                    </div>

                    <div class="campo">
                        <label for="quantidadeVolumes">Quantidade de volumes</label>
                        <input type="number" id="quantidadeVolumes" min="1" step="1" placeholder="0">
                    </div>

                    <div class="campo">
                        <label for="pesoReal">Peso real total</label>
                        <div class="entrada-unidade">
                            <input type="number" id="pesoReal" min="0.01" step="0.01" placeholder="0">
                            <span>kg</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="card">
                <h2>Dimensões dos volumes</h2>

                <div class="grid">
                    <div class="campo">
                        <label for="comprimento">Comprimento</label>
                        <div class="entradaUnidade">
                            <input type="number" id="comprimento" min="0.01" step="0.01" placeholder="0">
                            <span>cm</span>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="largura">Largura</label>
                        <div class="entradaUnidade">
                            <input type="number" id="largura" min="0.01" step="0.01" placeholder="0">
                            <span>cm</span>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="altura">Altura</label>
                        <div class="entradaUnidade">
                            <input type="number" id="altura" min="0.01" step="0.01" placeholder="0">
                            <span>cm</span>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="pedagio">Pedágio</label>
                        <div class="entradaUnidade">
                            <span>R$</span>
                            <input type="number" id="pedagio" min="0" step="0.01" value="0">
                        </div>
                    </div>
                </div>
            </section>

            <div class="botoes">
                <button type="submit" class="btnCalcular">Calcular frete</button>
                <button type="button" class="btnLimpar" onclick="limparDados()">Limpar dados</button>
            </div>
        </form>

        <section id="resultado" class="resultado"></section>

        <footer>
            <p> </p>
        </footer>
    </main>

    <script src="calcularF.js"></script>
</body>
</html>
